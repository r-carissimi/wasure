[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasure"
description = "A WebAssembly benchmarking suite for precise performance measurement"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Riccardo Carissimi" }]
keywords = [
    "wasure",
    "webassembly",
    "wasm",
    "benchmarking",
    "performance",
    "measurement",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]
dependencies = ["matplotlib", "psutil"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/r-carissimi/wasure"
"Bug Tracker" = "https://github.com/r-carissimi/wasure/issues"

[project.scripts]
wasure = "wasure.wasure:main"

# The version lives in the code so that `wasure --version` and the package
# metadata can never disagree.
[tool.setuptools.dynamic]
version = { attr = "wasure.wasure.VERSION_NUMBER" }

[tool.setuptools]
packages = ["wasure", "wasure.tools"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wasure"]

[tool.coverage.report]
# Lines that only run when wasure is invoked as a command are covered by
# subprocess tests, which coverage cannot observe, and are marked
# "pragma: no cover" at the source.
exclude_also = ["if __name__ == .__main__.:"]
# A floor rather than a target: the suite currently covers every reachable
# line, and this leaves room for a defensive branch without failing the build.
fail_under = 95
show_missing = true
